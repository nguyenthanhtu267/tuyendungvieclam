<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#163B7A">
<title>Đang ngoại tuyến — Tuyển Dụng Việc Làm</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#EEF1F6;color:#0A0E14;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
  main{max-width:560px;margin:0 auto}
  .logo{width:56px;height:56px;border-radius:14px;background:#163B7A;color:#fff;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  h1{font-size:22px;margin:0 0 6px}
  p{margin:0 0 14px;line-height:1.5;color:#1F2733}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;background:#FF5A36;color:#fff;padding:12px 20px;min-height:44px;cursor:pointer}
  h2{font-size:16px;margin:26px 0 8px}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  li{background:#fff;border:1px solid #E1E6ED;border-radius:12px;padding:12px 14px}
  li b{display:block;font-size:15px}
  li span{display:block;font-size:13px;color:#3D4654;margin-top:2px}
  .sal{color:#E5484D;font-weight:700}
  .note{font-size:12.5px;color:#3D4654}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">V</div>
  <h1>Bạn đang ngoại tuyến</h1>
  <p>Không có kết nối mạng. Hãy kiểm tra Wi-Fi/4G rồi thử lại — các việc làm bạn đã lưu vẫn xem được bên dưới.</p>
  <button type="button" id="retry">Thử lại</button>
  <h2 id="h" hidden>Việc làm đã lưu trên máy này</h2>
  <ul id="list"></ul>
  <h2 id="h2" hidden>Tin đã xem / đã ghim</h2>
  <ul id="list2"></ul>
  <p class="note" id="note" hidden>Danh sách này được lưu lần gần nhất bạn mở trang Hồ sơ khi còn mạng.</p>
</main>
<script>
(function () {
  document.getElementById('retry').onclick = function () { location.reload(); };
  window.addEventListener('online', function () { location.reload(); });
  try {
    var all = JSON.parse(localStorage.getItem('tvl_cache_jobs') || '{}');
    var pins = JSON.parse(localStorage.getItem('tvl_pinned_jobs') || '[]');
    var ids = Object.keys(all).sort(function (a, b) {
      var pa = pins.indexOf(a) >= 0 ? 1 : 0, pb = pins.indexOf(b) >= 0 ? 1 : 0;
      return pb - pa || all[b].t - all[a].t;
    });
    if (ids.length) {
      var ul2 = document.getElementById('list2');
      ids.forEach(function (id) {
        var j = all[id].v.job || {};
        var li = document.createElement('li');
        var b = document.createElement('b'); b.textContent = (pins.indexOf(id) >= 0 ? '\ud83d\udccc ' : '') + String(j.title || '');
        var c = document.createElement('span'); c.textContent = [j.company && j.company.name, (j.provinces || []).join(', ')].filter(Boolean).join(' \u00b7 ');
        li.appendChild(b); li.appendChild(c);
        var det = document.createElement('div'); det.hidden = true; det.style.whiteSpace = 'pre-line'; det.style.marginTop = '6px';
        var strip = function (t) { return String(t || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); };
        det.textContent = ['M\u00f4 t\u1ea3: ' + strip(j.description), j.requirements ? 'Y\u00eau c\u1ea7u: ' + strip(j.requirements) : '', j.benefits ? 'Quy\u1ec1n l\u1ee3i: ' + strip(j.benefits) : ''].filter(Boolean).join('\n');
        li.appendChild(det);
        li.style.cursor = 'pointer';
        li.onclick = function () { det.hidden = !det.hidden; };
        ul2.appendChild(li);
      });
      document.getElementById('h2').hidden = false;
    }
  } catch (e) {}
  try {
    var arr = JSON.parse(localStorage.getItem('tvl_saved_cache') || '[]');
    if (!Array.isArray(arr) || !arr.length) return;
    var ul = document.getElementById('list');
    arr.slice(0, 50).forEach(function (j) {
      var li = document.createElement('li');
      var b = document.createElement('b'); b.textContent = String(j.title || '');
      var c = document.createElement('span'); c.textContent = [j.company, j.location].filter(Boolean).join(' · ');
      li.appendChild(b); li.appendChild(c);
      if (j.salary) { var s = document.createElement('span'); s.className = 'sal'; s.textContent = j.salary; li.appendChild(s); }
      if (j.deadline) { var d = document.createElement('span'); d.textContent = 'Hạn nộp: ' + j.deadline; li.appendChild(d); }
      ul.appendChild(li);
    });
    document.getElementById('h').hidden = false;
    document.getElementById('note').hidden = false;
  } catch (e) {}
})();
</script>
</body>
</html>
